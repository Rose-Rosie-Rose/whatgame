<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재밌는 사이트 모음</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="hero-eyebrow">우리 팀이 직접 고른</p>
    <h1>재밌는 사이트 모음</h1>
    <p class="hero-desc">심심할 때 하나씩 눌러보세요.</p>
  </header>

  <main class="container">
    <ul class="card-grid">

      <!-- ▼▼▼▼▼ 카드 하나 시작 — 이 블록을 복사해서 쓰세요 ▼▼▼▼▼ -->
      <li class="card">
        <a class="card-link" href="https://www.monsterhunter.com/wilds/ko-kr/">
          <span><img src="img/monhun.webp" alt="monhun" width="300"></span>
          <span class="card-body">
            <strong class="card-title">몬스터헌터 와일즈</strong>
            <span class="card-summary">
              경천동지의, 사냥이 온다.
            </span>
            <span class="card-meta">추천 · 김희진</span>
          </span>
        </a>
      </li>
      <!-- ▲▲▲▲▲ 카드 하나 끝 ▲▲▲▲▲ -->
    </ul>
  </main>

  <footer class="site-foot">
    깃 · 깃허브 특강 팀 프로젝트
  </footer>

</body>
</html>
