<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재밌는 사이트 모음</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="hero-eyebrow">우리 팀이 직접 고른</p>
    <h1>재밌는 사이트 모음</h1>
    <p class="hero-desc">심심할 때 하나씩 눌러보세요.</p>
  </header>

  <main class="container">
    <ul class="card-grid">

      <!-- ▼▼▼▼▼ 카드 하나 시작 — 이 블록을 복사해서 쓰세요 ▼▼▼▼▼ -->
      <li class="card">
        <a class="card-link" href="https://nikke-kr.com/">
          <span><img src="img/nikke.webp" alt="nikke" width="300"></span>
          <span class="card-body">
            <strong class="card-title">승리의 여신:니케</strong>
            <span class="card-summary">
              니케. 지상을 빼앗긴 인류에게 승리를 가져다 줄 마지막 희망.
              그 절박한 염원이 담긴 이름과 함께 소녀들은 지상으로 향한다.
            </span>
            <span class="card-meta">추천 · 김희진</span>
          </span>
        </a>
      </li>
      <!-- ▲▲▲▲▲ 카드 하나 끝 ▲▲▲▲▲ -->

      <li class="card card-empty">
        <span>
          <span class="plus">＋</span>
          <strong>여기에 내 카드가 들어갑니다</strong>
          <em>위 블록을 복사해서 아래에 붙이세요</em>
        </span>
      </li>

      <li class="card card-empty">
        <span>
          <span class="plus">＋</span>
          <strong>여기에 내 카드가 들어갑니다</strong>
          <em>위 블록을 복사해서 아래에 붙이세요</em>
        </span>
      </li>

    </ul>
  </main>

  <footer class="site-foot">
    깃 · 깃허브 특강 팀 프로젝트
  </footer>

</body>
</html>
