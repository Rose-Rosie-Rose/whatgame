<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재밌는 사이트 모음</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="hero-eyebrow">우리 팀이 직접 고른</p>
    <h1>재밌는 사이트 모음</h1>
    <p class="hero-desc">심심할 때 하나씩 눌러보세요.</p>
  </header>

  <main class="container">
    <ul class="card-grid">
      <li class="card">
        <a class="card-link" href="https://store.steampowered.com/app/646570/Slay_the_Spire/">
          <span class="card-thumb" style="--thumb:#ffe4c2">🃏</span>
          </span>
          <span class="card-body">
            <strong class="card-title">슬레이 더 스파이어</strong>
            <span class="card-summary">
              로그라이크 형식의 카드 덱 빌딩 게임
             </span>
            <span class="card-meta">추천 · 강병훈</span>
          </span>
        </a>
      </li>
     </main>
      <li class="card">
        <a class="card-link" href="https://www.counterside.com/">
          <span><img src="img/counterside.webp" alt="counterside" width="300"></span>
          <span class="card-body">
            <strong class="card-title">카운터 사이드</strong>
            <span class="card-summary">
              THIS IS NOT WAR
              IT' S BUSINESS
            </span>
            <span class="card-meta">추천 · 김희진</span>
          </span>
        </a>
      </li>
    </main>
      <!-- ▲▲▲▲▲ 카드 하나 끝 ▲▲▲▲▲ -->
       <li class="card">
        <a class="card-link" href="sites/neal-fun.html">
          <span class="card-thumb" style="--thumb:#ffe4c2">
            <img 
              class="card-thumb-img"
              src="img/maplestory.jpg"
            />
          </span>
          <span class="card-body">
            <strong class="card-title">메이플스토리</strong>
            <span class="card-summary">
              다양한 작업과 모험을 즐기며 캐릭터를 성장시키는 2D MMORPG
            </span>
            <span class="card-meta">추천 · 강경원</span>
          </span>
        </a>
      </li>
    </ul>
  </main>
      <li class="card">
        <a class="card-link" href="https://zenless.hoyoverse.com/ko-kr/main">
          <span class="card-thumb" style="--thumb:#ffe4c2">⚔️</span>
          <span class="card-body">
            <strong class="card-title">젠레스존제로</strong>
            <span class="card-summary">
              액션의 재미를 느끼면서 스토리도 재밌는 게임
            </span>
            <span class="card-meta">추천 · 강병훈</span>
          </span>
        </a>
      </li>
    </ul>
  </main>

  <footer class="site-foot">
    깃 · 깃허브 특강 팀 프로젝트
  </footer>

</body>
</html>
