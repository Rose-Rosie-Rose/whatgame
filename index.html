<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재밌는 사이트 모음</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="hero-eyebrow">우리 팀이 직접 고른</p>
    <h1>재밌는 사이트 모음</h1>
    <p class="hero-desc">심심할 때 하나씩 눌러보세요.</p>
  </header>

  <main class="container">
    <ul class="card-grid">
      <!-- ▼▼▼▼▼ 카드 하나 시작 — 이 블록을 복사해서 쓰세요 ▼▼▼▼▼ -->
      <li class="card">
        <a class="card-link" href="https://zenless.hoyoverse.com/ko-kr/main">
          <span class="card-thumb" style="--thumb:#ffe4c2">⚔️</span>
          <span class="card-body">
            <strong class="card-title">젠레스존제로</strong>
            <span class="card-summary">
              액션의 재미를 느끼면서 스토리도 재밌는 게임
            </span>
            <span class="card-meta">추천 · 강병훈</span>
          </span>
        </a>
      </li>
      <!-- ▲▲▲▲▲ 카드 하나 끝 ▲▲▲▲▲ -->
    </ul>
  </main>

  <footer class="site-foot">
    깃 · 깃허브 특강 팀 프로젝트
  </footer>

</body>
</html>
